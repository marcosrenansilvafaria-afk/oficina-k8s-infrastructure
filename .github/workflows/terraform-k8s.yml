name: Terraform K8s Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

env:
  TF_VERSION: "1.9.5"
  AWS_REGION: "us-east-1"

jobs:
  lint-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (sem backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: false

      - name: Security scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false

  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: lint-validate
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -var="db_state_bucket=${{ secrets.TF_STATE_BUCKET }}"
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}

      - name: Comentar plano no PR
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan
            \`\`\`
            ${process.env.PLAN}
            \`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: lint-validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Provisionar um cluster EKS (control plane + node group) e o Metrics
    # Server via Helm pode levar 15-20 minutos.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      # Aplicado em duas fases: o provider helm/kubernetes autentica no
      # cluster usando um token calculado no INICIO do processo do
      # `terraform apply` - se o cluster e o Access Entry da propria CI
      # forem criados no mesmo apply que tenta usar o provider helm, a
      # autenticacao falha ("the server has asked for the client to provide
      # credentials"), mesmo com o Access Entry ja existindo ao final. A
      # 2a fase roda em um processo `terraform apply` novo, que recalcula o
      # token de autenticacao ja com o Access Entry propagado.
      - name: Terraform apply (fase 1 - cluster e Access Entries)
        run: |
          terraform apply -auto-approve -input=false \
            -var="db_state_bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -target=module.eks \
            -target=aws_eks_access_entry.ci_admin \
            -target=aws_eks_access_policy_association.ci_admin \
            -target=aws_eks_access_entry.app_deploy \
            -target=aws_eks_access_policy_association.app_deploy
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}

      - name: Terraform apply (fase 2 - restante, incluindo Metrics Server)
        run: terraform apply -auto-approve -input=false -var="db_state_bucket=${{ secrets.TF_STATE_BUCKET }}"
        env:
          TF_VAR_environment: ${{ vars.TF_ENVIRONMENT }}
